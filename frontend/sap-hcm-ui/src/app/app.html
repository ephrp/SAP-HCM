<div class="app-layout">
  <div class="topbar">
    <div class="logo">PeopleFlow</div>

    <div class="right-section" *ngIf="authService.getToken()">
      <button class="notif-button" type="button" (click)="toggleNotifications()">
        <span class="notif-icon">🔔</span>

        <span *ngIf="unreadCount > 0" class="notif-badge">
          {{ unreadCount }}
        </span>
      </button>

      <div class="notif-dropdown" *ngIf="showNotifications">
        <div class="notif-header">
          <div>
            <strong>Notifications</strong>
            <p>{{ unreadCount }} non lue(s)</p>
          </div>

          <button
            *ngIf="unreadCount > 0"
            class="mark-all-btn"
            type="button"
            (click)="markAllAsRead()"
          >
            Tout lire
          </button>
        </div>

        <div *ngIf="notifications.length === 0" class="notif-empty">
          Aucune notification
        </div>

        <div class="notif-list" *ngIf="notifications.length > 0">
          <div
            class="notif-item"
            *ngFor="let n of notifications"
            [class.unread]="!n.isRead"
            (click)="markAsRead(n)"
          >
            <div class="notif-item__icon">
              {{ getNotificationIcon(n.type) }}
            </div>

            <div class="notif-item__content">
              <div class="notif-title">{{ n.title }}</div>
              <div class="notif-message">{{ n.message }}</div>
              <div class="notif-date">
                {{ n.createdAt | date:'short' }}
              </div>
            </div>

            <span *ngIf="!n.isRead" class="unread-dot"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="page-content">
    <router-outlet></router-outlet>
  </div>
</div>

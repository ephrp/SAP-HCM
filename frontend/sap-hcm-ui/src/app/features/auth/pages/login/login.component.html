<section class="login">
  <div class="login__card">
    <div class="login__brand">
      <span class="dot"></span>
      <span class="brand">PeopleFlow</span>
      <span class="tag">MVP</span>
    </div>

    <div class="login__header">
      <h1>Connexion</h1>
      <p>Authentification réelle avec JWT.</p>
    </div>

    <div class="form">
      <label class="field">
        <span class="field__label">Email</span>
        <input
          class="field__control"
          type="email"
          [(ngModel)]="email"
          placeholder="ex: admin@test.com"
        />
      </label>

      <label class="field">
        <span class="field__label">Password</span>
        <input
          class="field__control"
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
        />
      </label>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button
        class="btn btn--primary"
        type="button"
        (click)="submit()"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Connexion...' : 'Login' }}
      </button>
    </div>

    <div class="login__hint">
      <p>Exemple : admin@test.com / 123456</p>
    </div>
  </div>
</section>

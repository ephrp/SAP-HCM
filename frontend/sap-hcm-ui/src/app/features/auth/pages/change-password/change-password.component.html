<section class="login">
  <div class="login__card">
    <div class="login__brand">
      <span class="dot"></span>
      <span class="brand">PeopleFlow</span>
      <span class="tag">MVP</span>
    </div>

    <div class="login__header">
      <h1>Changer le mot de passe</h1>
      <p>Vous devez modifier votre mot de passe temporaire avant de continuer.</p>
    </div>

    <div class="form">
      <label class="field">
        <span class="field__label">Mot de passe actuel</span>
        <input
          class="field__control"
          type="password"
          [(ngModel)]="currentPassword"
          placeholder="••••••••"
        />
      </label>

      <label class="field">
        <span class="field__label">Nouveau mot de passe</span>
        <input
          class="field__control"
          type="password"
          [(ngModel)]="newPassword"
          placeholder="••••••••"
        />
      </label>

      <label class="field">
        <span class="field__label">Confirmer le nouveau mot de passe</span>
        <input
          class="field__control"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="••••••••"
        />
      </label>

      <p class="error" *ngIf="error">{{ error }}</p>
      <p class="success" *ngIf="success">{{ success }}</p>

      <button
        class="btn btn--primary"
        type="button"
        (click)="submit()"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Mise à jour...' : 'Mettre à jour le mot de passe' }}
      </button>
    </div>
  </div>
</section>
